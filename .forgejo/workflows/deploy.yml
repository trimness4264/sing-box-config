name: Build and deploy configurations

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: forgejo.ref == 'refs/heads/main'
    runs-on: sing-box-config
    timeout-minutes: 10
    steps:
      - name: Check out configuration repository
        uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Generate configurations
        run: npm run build

      - name: Publish configurations (opt in)
        if: vars.DEPLOY_ENABLED == 'true'
        run: node ci/deploy.mjs
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_GROUP: ${{ secrets.DEPLOY_GROUP }}
